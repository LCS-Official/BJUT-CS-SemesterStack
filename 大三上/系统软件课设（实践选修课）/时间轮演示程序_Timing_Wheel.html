<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux 内核时间轮 可视化模拟</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #4CAF50;
            --tv1-color: #4CAF50;
            --tv2-color: #2196F3;
            --tv3-color: #9C27B0;
            --tv4-color: #FF9800;
            --tv5-color: #F44336;
            --panel-bg: #2d2d2d;
            --border-color: #404040;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 { margin: 0; font-size: 1.5rem; }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        button:hover { background-color: #3d3d3d; }
        button.primary { background-color: var(--accent-color); color: white; border: none; }
        button.primary:hover { background-color: #45a049; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .main-container {
            display: flex;
            flex: 1;
            gap: 20px;
            margin-top: 20px;
            overflow: hidden;
        }

        /* 左侧：时间轮展示区 */
        .wheels-container {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .wheel-row {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 10px;
            position: relative;
            border-left: 5px solid transparent;
        }

        .wheel-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .wheel-info { font-size: 0.9em; opacity: 0.8; }

        .slots-track {
            display: flex;
            gap: 2px;
            height: 50px;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            align-items: center;
        }

        .slot {
            flex: 1;
            height: 100%;
            border-right: 1px solid #333;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.7em;
            color: #666;
            transition: background 0.2s;
        }

        .slot.active {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
        }

        .task-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: white;
            position: absolute;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }

        /* 特定轮子颜色 */
        .w-tv1 { border-left-color: var(--tv1-color); }
        .w-tv2 { border-left-color: var(--tv2-color); }
        .w-tv3 { border-left-color: var(--tv3-color); }
        .w-tv4 { border-left-color: var(--tv4-color); }
        .w-tv5 { border-left-color: var(--tv5-color); }

        .w-tv1 .task-dot { background-color: var(--tv1-color); }
        .w-tv2 .task-dot { background-color: var(--tv2-color); }
        .w-tv3 .task-dot { background-color: var(--tv3-color); }
        .w-tv4 .task-dot { background-color: var(--tv4-color); }
        .w-tv5 .task-dot { background-color: var(--tv5-color); }

        /* 右侧：控制与日志 */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 300px;
        }

        .status-panel {
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 1.1em;
        }

        .jiffies-display {
            font-family: 'Consolas', monospace;
            font-size: 1.5em;
            color: var(--accent-color);
        }

        .log-panel {
            flex: 1;
            background-color: #111;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 0.9em;
        }

        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #222; padding-bottom: 2px; }
        .log-time { color: #888; margin-right: 5px; }
        .log-add { color: #81C784; }
        .log-exec { color: #64B5F6; font-weight: bold; }
        .log-cascade { color: #FFD54F; }

        .add-task-panel {
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
        }

        input[type="number"] {
            background: #111;
            border: 1px solid #444;
            color: white;
            padding: 5px;
            width: 80px;
            border-radius: 4px;
        }

    </style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap:10px;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <h1>Linux 时间轮模拟程序</h1>
    </div>
    <div class="controls">
        <button id="btnStep" onclick="sim.step()">单步运行</button>
        <button id="btnRun" class="primary" onclick="sim.toggleRun()">自动运行</button>
        <button onclick="sim.reset()">重置</button>
        <select id="speedControl" onchange="sim.setSpeed(this.value)" style="background:#2d2d2d; color:white; border:1px solid #444; padding:5px;">
            <option value="500">慢速</option>
            <option value="100" selected>正常</option>
            <option value="10">极速</option>
        </select>
    </div>
</header>

<div class="main-container">
    <div class="wheels-container" id="wheelsContainer">
        <!-- 动态生成 5 个轮子 -->
    </div>

    <div class="sidebar">
        <div class="status-panel">
            <div class="stat-row">
                <span>Current Jiffies:</span>
                <span class="jiffies-display" id="dispJiffies">0</span>
            </div>
            <div class="stat-row">
                <span>Timer Jiffies:</span>
                <span class="jiffies-display" style="color: #ccc; font-size:1.2em;" id="dispTimerJiffies">0</span>
            </div>
            <div style="margin-top:10px; font-size:0.8em; color:#888;">
                TV1 (秒): 0-255 ticks<br>
                TV2 (分): 256-16383 ticks<br>
                TV3 (时): 16K-1M ticks
            </div>
        </div>

        <div class="add-task-panel">
            <input type="number" id="inpTimeout" placeholder="Ticks" value="50">
            <button onclick="userAddTask()">添加任务 (+Ticks)</button>
        </div>

        <div class="log-panel" id="logPanel">
            <!-- 日志区 -->
        </div>
    </div>
</div>

<script>
// ==========================================
// 核心逻辑模拟 (JavaScript 实现)
// ==========================================

const TVN_BITS = 6;
const TVR_BITS = 8;
const TVN_SIZE = 1 << TVN_BITS; // 64
const TVR_SIZE = 1 << TVR_BITS; // 256
const TVN_MASK = TVN_SIZE - 1;
const TVR_MASK = TVR_SIZE - 1;

class Timer {
    constructor(expires, id) {
        this.expires = expires;
        this.id = id;
        this.list = null; // 模拟链表节点
    }
}

class TimerVec {
    constructor(size, name, level) {
        this.index = 0;
        this.size = size;
        this.name = name;
        this.level = level; // 1-5
        this.vec = new Array(size).fill(null).map(() => []); // 数组模拟链表
    }
}

class Simulator {
    constructor() {
        this.jiffies = 0;
        this.timer_jiffies = 0;
        this.timers = [];
        this.isRunning = false;
        this.timerIdCounter = 1;
        this.speed = 100;
        this.intervalHandle = null;

        this.tvecs = [
            null, // 占位，让下标从1开始
            new TimerVec(TVR_SIZE, "TV1 (秒针，256 进制)", 1),
            new TimerVec(TVN_SIZE, "TV2 (分针，64 进制)", 2),
            new TimerVec(TVN_SIZE, "TV3 (时针)", 3),
            new TimerVec(TVN_SIZE, "TV4 (日针)", 4),
            new TimerVec(TVN_SIZE, "TV5 (年针)", 5)
        ];

        this.initUI();
        this.log("系统初始化完成。等待运行...", "sys");
    }

    // --- 内核算法核心 ---

    internal_add_timer(timer) {
        let expires = timer.expires;
        let idx = expires - this.timer_jiffies;
        let vec = null;
        let slot = 0;
        let targetTv = 0;

        if (idx < TVR_SIZE) {
            let i = expires & TVR_MASK;
            vec = this.tvecs[1];
            slot = i;
            targetTv = 1;
        } else if (idx < (1 << (TVR_BITS + TVN_BITS))) {
            let i = (expires >> TVR_BITS) & TVN_MASK;
            vec = this.tvecs[2];
            slot = i;
            targetTv = 2;
        } else if (idx < (1 << (TVR_BITS + 2 * TVN_BITS))) {
            let i = (expires >> (TVR_BITS + TVN_BITS)) & TVN_MASK;
            vec = this.tvecs[3];
            slot = i;
            targetTv = 3;
        } else if (idx < (1 << (TVR_BITS + 3 * TVN_BITS))) {
            let i = (expires >> (TVR_BITS + 2 * TVN_BITS)) & TVN_MASK;
            vec = this.tvecs[4];
            slot = i;
            targetTv = 4;
        } else if (idx < 0) {
            vec = this.tvecs[1];
            slot = this.tvecs[1].index;
            targetTv = 1;
        } else {
            let i = (expires >> (TVR_BITS + 3 * TVN_BITS)) & TVN_MASK;
            vec = this.tvecs[5];
            slot = i;
            targetTv = 5;
        }

        vec.vec[slot].push(timer);
        this.updateWheelUI(targetTv);
        return targetTv; // 返回它是去哪个轮子了
    }

    cascade_timers(tv) {
        let head = tv.vec[tv.index]; // 取出当前槽位的所有任务
        
        // 清空当前槽位 (模拟 list_replace_init)
        tv.vec[tv.index] = [];
        
        // 这一步很重要：在UI上高亮显示级联发生了
        this.log(`>>> 触发级联 ${tv.name} Index: ${tv.index}`, "cascade");

        // 重新分发任务
        for (let timer of head) {
            let target = this.internal_add_timer(timer);
            // 简单的动画效果或日志
            // this.log(`  └─ 任务 #${timer.id} 降级到 TV${target}`, "cascade-detail");
        }

        tv.index = (tv.index + 1) & TVN_MASK;
        this.updateWheelUI(tv.level);
        return tv.index;
    }

    run_timer_list() {
        while (this.jiffies - this.timer_jiffies >= 0) {
            // 检查 TV1 是否转完了一圈
            if (this.tvecs[1].index === 0) {
                let n = 2;
                // 级联逻辑
                do {
                    let idx = this.cascade_timers(this.tvecs[n]);
                    // 如果当前轮子 index 变成了 1 (说明刚才它是 0，然后 ++ 变成了 1)，说明它也转了一圈
                    // 注意：cascade_timers 内部已经做了 index++
                    if (this.tvecs[n].index === 1) {
                        n++;
                    } else {
                        break;
                    }
                } while (n < 6);
            }

            // 处理 TV1 当前槽位的任务
            let currentSlot = this.tvecs[1].vec[this.tvecs[1].index];
            if (currentSlot.length > 0) {
                while (currentSlot.length > 0) {
                    let timer = currentSlot.shift(); // detach
                    this.execute_timer(timer);
                }
            }

            this.timer_jiffies++;
            this.tvecs[1].index = (this.tvecs[1].index + 1) & TVR_MASK;
            this.updateWheelUI(1);
        }
        
        this.updateStatusUI();
    }

    execute_timer(timer) {
        this.log(`执行任务 #${timer.id} (预期: ${timer.expires}, 实际: ${this.jiffies})`, "exec");
    }

    // --- 控制逻辑 ---

    step() {
        this.jiffies++;
        this.run_timer_list();
        this.updateStatusUI();
    }

    toggleRun() {
        if (this.isRunning) {
            clearInterval(this.intervalHandle);
            this.isRunning = false;
            document.getElementById('btnRun').innerText = "自动运行 (Run)";
            document.getElementById('btnRun').classList.remove('running');
        } else {
            this.intervalHandle = setInterval(() => this.step(), this.speed);
            this.isRunning = true;
            document.getElementById('btnRun').innerText = "暂停 (Pause)";
            document.getElementById('btnRun').classList.add('running');
        }
    }

    setSpeed(val) {
        this.speed = parseInt(val);
        if (this.isRunning) {
            clearInterval(this.intervalHandle);
            this.intervalHandle = setInterval(() => this.step(), this.speed);
        }
    }

    reset() {
        if (this.isRunning) this.toggleRun();
        this.jiffies = 0;
        this.timer_jiffies = 0;
        this.timerIdCounter = 1;
        this.tvecs.forEach(tv => {
            if(tv) {
                tv.index = 0;
                tv.vec = new Array(tv.size).fill(null).map(() => []);
            }
        });
        document.getElementById('logPanel').innerHTML = '';
        this.updateStatusUI();
        for(let i=1; i<=5; i++) this.updateWheelUI(i);
        this.log("系统已重置", "sys");
    }

    addTask(ticks) {
        let expires = this.jiffies + ticks;
        let t = new Timer(expires, this.timerIdCounter++);
        let target = this.internal_add_timer(t);
        this.log(`添加任务 #${t.id} (+${ticks}) -> TV${target}`, "add");
    }

    // --- UI 渲染 ---

    initUI() {
        const container = document.getElementById('wheelsContainer');
        container.innerHTML = '';
        
        // 创建5个轮子的DOM
        for(let i=1; i<=5; i++) {
            let tv = this.tvecs[i];
            let row = document.createElement('div');
            row.className = `wheel-row w-tv${i}`;
            row.innerHTML = `
                <div class="wheel-header">
                    <span>${tv.name}</span>
                    <span class="wheel-info" id="tv${i}-info">Index: 0</span>
                </div>
                <div class="slots-track" id="tv${i}-track"></div>
            `;
            container.appendChild(row);
            this.renderWheelSlots(i);
        }
    }

    renderWheelSlots(level) {
        const track = document.getElementById(`tv${level}-track`);
        track.innerHTML = '';
        let tv = this.tvecs[level];
        // 为了性能，只渲染部分槽位（前后一些），或者简化渲染
        // 这里采用渲染全部但用 flex 压缩，或者只渲染 active 附近的
        // 为了演示清晰，我们只显示 active index 附近的窗口
        // 但为了简单，先渲染 32 个格子的视窗
        
        for(let i=0; i<32; i++) { // 显示窗口大小
            let div = document.createElement('div');
            div.className = 'slot';
            div.id = `tv${level}-slot-${i}`;
            track.appendChild(div);
        }
    }

    updateWheelUI(level) {
        let tv = this.tvecs[level];
        document.getElementById(`tv${level}-info`).innerText = `Index: ${tv.index}`;
        
        // 更新视窗：始终让 index 位于左侧或者中间
        // 这里做一个简单的滚动视窗效果：显示 index, index+1, ... 
        const track = document.getElementById(`tv${level}-track`);
        const slotsDOM = track.children;
        
        for(let i=0; i<slotsDOM.length; i++) {
            let realIdx = (tv.index + i) & (tv.size - 1); // 循环取值
            let slotDiv = slotsDOM[i];
            let tasks = tv.vec[realIdx];
            
            slotDiv.innerHTML = `<div>${realIdx}</div>`;
            if (i === 0) slotDiv.classList.add('active'); // 当前指针位置
            else slotDiv.classList.remove('active');

            // 渲染任务点
            if (tasks && tasks.length > 0) {
                let count = tasks.length > 3 ? '3+' : tasks.length;
                let dots = '';
                // 简单的视觉表示
                tasks.slice(0, 3).forEach(() => {
                    dots += `<div class="task-dot" style="position:static; display:inline-block; margin:1px;"></div>`;
                });
                if(tasks.length > 3) dots += '+';
                slotDiv.innerHTML += `<div>${dots}</div>`;
                slotDiv.style.backgroundColor = 'rgba(255,255,255,0.05)';
            } else {
                slotDiv.style.backgroundColor = 'transparent';
            }
        }
    }

    updateStatusUI() {
        document.getElementById('dispJiffies').innerText = this.jiffies;
        document.getElementById('dispTimerJiffies').innerText = this.timer_jiffies;
    }

    log(msg, type) {
        const panel = document.getElementById('logPanel');
        const div = document.createElement('div');
        div.className = `log-entry log-${type}`;
        div.innerHTML = `<span class="log-time">[${this.jiffies}]</span> ${msg}`;
        panel.prepend(div); // 最新日志在最上
    }
}

const sim = new Simulator();

function userAddTask() {
    const val = parseInt(document.getElementById('inpTimeout').value);
    if(val > 0) sim.addTask(val);
}

// 预置几个任务演示
sim.addTask(10);    // TV1
sim.addTask(300);   // TV2 (Cascade)
sim.addTask(60000); // TV3
sim.step(); // 走一步刷新UI

</script>

</body>
</html>
